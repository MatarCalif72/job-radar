name: job-radar

on:
  schedule:
    - cron: "7 */2 * * *"   # every 2 hours, every day of the week (UTC)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: job-radar           # never run two at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find new jobs and send them to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m job_radar
      - name: Save list of sent jobs
        if: always()         # save even if a later message failed
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add data/seen.json
          # pull first: the Redefine page may have saved new settings in the meantime
          git diff --cached --quiet || (git commit -m "update seen jobs" && git pull --rebase origin "$GITHUB_REF_NAME" && git push)
